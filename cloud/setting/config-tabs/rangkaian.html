<div class="system-control-section" style="margin-top: 32px;">
	<h3 class="system-control-title">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" class="w-5 h-5" style="color: currentColor; width: 20px; height: 20px;" stroke="currentColor">
			<path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
		</svg>
		Status Rangkaian
	</h3>
	<div class="system-control-content">
		<div class="system-control-item" style="margin-bottom: 8px;">
			<div class="system-control-info">
				<div class="system-control-label">Status Semasa</div>
				<div class="system-control-description" id="wifi-status-text" style="color: #64748b;">Memuatkan...</div>
				<div class="system-control-description" id="hotspot-status-text" style="color: #64748b; margin-top: 4px;"></div>
			</div>
			<button type="button" class="btn-reboot" onclick="refreshNetworkStatus()" title="Refresh Status" style="background: #6b7280;">
				<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5" style="width: 20px; height: 20px;">
					<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
				</svg>
				<span>Refresh</span>
			</button>
		</div>
		<div class="system-control-description" style="font-size: 12px; color: #64748b; margin-top: 10px;">
			Konfigurasi WiFi dan hotspot hanya tersedia dari panel tetapan tempatan kiosk. Dalam mod hotspot: sambung ke "iPray-Hotspot", buka http://10.42.0.1:3001
		</div>
	</div>
</div>
