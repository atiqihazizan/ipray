name: Sync to ipray-kiosk
# Auto-sync dari ipray (main) ke repo cermin ipray-kiosk.
# Kiosk pull melalui scripts/kiosk-update.sh (cron 10 minit) — restart hanya jika perlu.

on:
  push:
    branches:
      - main
    paths:
      - 'react/**'
      - 'nodejs/services/**'
      - 'nodejs/setting/**'
      - 'nodejs/main.js'
      - 'nodejs/utils/**'
      - 'nodejs/package.json'
      - 'nodejs/package-lock.json'
      - 'nodejs/data/**'
      - 'nodejs/public/**'
      - 'scripts/network-monitor.js'
      - 'scripts/kiosk-update.sh'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — sync sahaja, tiada commit/push'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-kiosk
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Checkout ipray repo
      - name: Checkout ipray
        uses: actions/checkout@v4
        with:
          path: ipray

      # Setup Node.js untuk build React
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build React (output terus ke ipray/nodejs/public)
      - name: Install dependencies
        run: |
          cd ipray/react
          npm ci
      - name: Build React
        run: |
          cd ipray/react
          npm run build

      # Checkout ipray-kiosk repo (menggunakan PAT untuk write access)
      - name: Checkout ipray-kiosk
        uses: actions/checkout@v4
        with:
          repository: atiqihazizan/ipray-kiosk
          path: ipray-kiosk
          token: ${{ secrets.KIOSK_SYNC_TOKEN }}

      # Sync kod ke repo cermin.
      # --delete untuk folder kod supaya fail lapuk di cermin turut dibuang;
      # public/ TANPA --delete supaya fail kiosk yang tidak dijejak (public/img
      # dsb.) kekal. data/ dihantar sebahagian sahaja — config.txt TIDAK.
      - name: Sync files (rsync)
        run: |
          set -e
          SRC=ipray/nodejs
          DST=ipray-kiosk

          # Kod — --delete
          rsync -a --delete "$SRC/services/" "$DST/services/"
          rsync -a --delete "$SRC/setting/"  "$DST/setting/"
          rsync -a --delete "$SRC/utils/"    "$DST/utils/"

          # public — tanpa --delete (kekalkan fail kiosk tidak dijejak)
          rsync -a "$SRC/public/" "$DST/public/"
          # assets/ dengan --delete: aset bundle lama yang tidak lagi
          # dijana oleh build dibuang supaya tidak terkumpul
          rsync -a --delete "$SRC/public/assets/" "$DST/public/assets/"

          # Fail root
          for f in main.js package.json package-lock.json nodemon.json electron-builder.yml env.example; do
            [ -f "$SRC/$f" ] && cp "$SRC/$f" "$DST/$f"
          done

          # scripts/ — hanya dua fail ini, jangan timpa fail sedia ada lain
          mkdir -p "$DST/scripts"
          cp ipray/scripts/network-monitor.js "$DST/scripts/network-monitor.js"
          cp ipray/scripts/kiosk-update.sh    "$DST/scripts/kiosk-update.sh"
          chmod +x "$DST/scripts/kiosk-update.sh"

          # data — hanya fail yang dihantar ke kiosk (config.txt TIDAK disalin)
          cp "$SRC/data/images.txt"     "$DST/data/images.txt"
          cp "$SRC/data/countdowns.txt" "$DST/data/countdowns.txt"

      # Dry run: papar perubahan repo cermin, jangan commit/push
      - name: Dry run — status repo cermin
        if: ${{ inputs.dry_run == true }}
        run: |
          cd ipray-kiosk
          echo "=== git status ==="
          git status --short
          echo "=== git diff --stat (tracked) ==="
          git diff --stat HEAD || true

      # Commit dan push ke ipray-kiosk (skip bila dry_run)
      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        run: |
          cd ipray-kiosk
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-sync from ipray ${{ github.sha }} [skip ci]"
      - name: Push to ipray-kiosk
        if: ${{ inputs.dry_run != true }}
        run: |
          cd ipray-kiosk
          git push origin main
